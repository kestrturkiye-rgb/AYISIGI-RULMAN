name: Publish Rulman Teklif

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify catalog and search
        run: |
          node tests/catalog.test.js
          node tests/technical-search.test.js
          python tests/test_skf_data.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build for the project address
        run: npm run build -- --base="/${{ github.event.repository.name }}/"
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
