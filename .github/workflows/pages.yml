name: Publish Rulman Teklif

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify catalog and search
        run: |
          node tests/catalog.test.js
          node --test tests/catalog-additions.test.js
          python tests/test_catalog_additions.py
          node tests/image-cleanup.test.js
          node tests/technical-search.test.js
          node tests/site.test.js
          node --test tests/supabase-auth.test.mjs
          npm run test:admin
          node --test tests/admin/gateway.test.mjs
          node --test tests/privacy/consent.test.mjs tests/privacy/discovery.test.mjs tests/security/auth.test.mjs tests/security/domain.test.mjs
          node --test tests/admin/spreadsheets.test.mjs
          node tests/performance/public-read-cache.test.mjs
          node tests/seo/google-tags.test.mjs
          node tests/i18n/core.test.mjs
          node tests/branding/domains.test.mjs
          node tests/analytics/domain-gateway.test.mjs
          python tests/security/test_smtp.py
          node tests/quote.test.js
          node --test tests/server.test.js
          python tests/test_skf_data.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build for the project address
        env:
          VITE_STATIC_HOST: 'true'
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE || 'supabase' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:pages -- --base="/${{ github.event.repository.name }}/"
      - name: Verify crawlable page renderer
        run: |
          node -e "require('node:fs').copyFileSync('dist/index.html','api/site-shell.html')"
          node tests/seo/server.test.mjs
          node tests/branding/server.test.mjs
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
